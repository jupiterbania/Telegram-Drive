name: "Build iOS Package (IPA & Simulator)"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target Release Tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS App (IPA & Simulator)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Initialize Tauri iOS project
        working-directory: app
        run: |
          npx tauri ios init

      - name: Configure Xcode Project for Unsigned CI Builds
        working-directory: app
        run: |
          if [ -d "src-tauri/gen/apple" ]; then
            find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/g' {} + || true
            find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/DevelopmentTeam = [^;]*;/DevelopmentTeam = "";/g' {} + || true
          fi

      - name: Build iOS App via Tauri
        working-directory: app
        run: |
          echo "Building iOS binary for aarch64-apple-ios..."
          npx tauri ios build --ci --target aarch64-apple-ios || true

          # If direct target build needs manual Xcode step
          if [ -d "src-tauri/gen/apple" ]; then
            cd src-tauri/gen/apple
            WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1)
            PROJECT=$(find . -name "*.xcodeproj" -maxdepth 1 | head -n 1)
            
            if [ -n "$WORKSPACE" ]; then
              xcodebuild -workspace "$WORKSPACE" \
                -scheme app_iOS \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -derivedDataPath derivedData \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                PROVISIONING_PROFILE_SPECIFIER="" \
                DEVELOPMENT_TEAM="" \
                build || true
            elif [ -n "$PROJECT" ]; then
              xcodebuild -project "$PROJECT" \
                -scheme app_iOS \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -derivedDataPath derivedData \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                PROVISIONING_PROFILE_SPECIFIER="" \
                DEVELOPMENT_TEAM="" \
                build || true
            fi
          fi

      - name: Package iOS IPA & Validate Real Bundle Size
        working-directory: app
        run: |
          mkdir -p ios-artifacts
          TAG="${{ github.event.inputs.release_tag || 'v1.2.0' }}"
          
          # Search for genuine .app bundle
          APP_PATHS=$(find src-tauri -name "*.app" -type d)
          echo "Found candidate .app bundles:"
          echo "$APP_PATHS"
          
          BEST_APP=""
          BEST_SIZE=0
          
          for app in $APP_PATHS; do
            # Check size in KB
            SIZE=$(du -sk "$app" | awk '{print $1}')
            echo "App: $app -> ${SIZE} KB"
            if [ "$SIZE" -gt "$BEST_SIZE" ]; then
              BEST_SIZE=$SIZE
              BEST_APP=$app
            fi
          done
          
          if [ -n "$BEST_APP" ] && [ "$BEST_SIZE" -gt 1000 ]; then
            echo "Packaging genuine iOS bundle: $BEST_APP (${BEST_SIZE} KB)"
            mkdir -p Payload
            cp -r "$BEST_APP" Payload/
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Direct-Install.ipa" Payload
            zip -r "ios-artifacts/TG-Drive-${TAG}-iOS-Simulator-App.zip" "$BEST_APP"
          else
            echo "Error: No valid compiled iOS .app found with size > 1MB!"
            # Don't create corrupted small dummy files
            exit 1
          fi
          
          ls -la ios-artifacts/

      - name: Upload iOS Artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || 'v1.2.0' }}
        run: |
          if [ -d ios-artifacts ] && [ "$(ls -A ios-artifacts)" ]; then
            gh release upload "${TAG_NAME}" ios-artifacts/* --clobber
          fi
