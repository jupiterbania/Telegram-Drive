name: "Build iOS Package (IPA & Simulator)"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target Release Tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS App (IPA & Simulator)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Build Rust Library for iOS targets
        working-directory: app
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios-sim --release

      - name: Initialize Tauri iOS project
        working-directory: app
        run: |
          npx tauri ios init

      - name: Build iOS Application
        working-directory: app
        run: |
          npx tauri ios build --ci --target aarch64 --export-method development || true

      - name: Package iOS IPA & Simulator Artifacts (Node packager)
        working-directory: app
        env:
          TAG_NAME: ${{ github.event.inputs.release_tag || 'v1.2.0' }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          function findApp(dir) {
            let matches = [];
            try {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name.endsWith(".app")) {
                    matches.push(full);
                  } else {
                    matches = matches.concat(findApp(full));
                  }
                }
              }
            } catch (e) {}
            return matches;
          }

          const apps = findApp("src-tauri");
          console.log("Found .app bundles:", apps);

          let bestApp = null;
          let bestSize = 0;

          for (const app of apps) {
            try {
              // Calculate size by walking
              let total = 0;
              function calc(p) {
                const stat = fs.statSync(p);
                if (stat.isDirectory()) {
                  for (const c of fs.readdirSync(p)) calc(path.join(p, c));
                } else {
                  total += stat.size;
                }
              }
              calc(app);
              console.log(`App: ${app} -> ${(total / (1024*1024)).toFixed(2)} MB`);
              if (total > bestSize) {
                bestSize = total;
                bestApp = app;
              }
            } catch (e) {
              console.error("Error inspecting:", app, e.message);
            }
          }

          if (!bestApp) {
            console.error("No iOS .app bundle found in src-tauri!");
            process.exit(1);
          }

          console.log(`Selecting best app bundle: ${bestApp} (${(bestSize / (1024*1024)).toFixed(2)} MB)`);
          fs.mkdirSync("ios-artifacts", { recursive: true });
          fs.rmSync("Payload", { recursive: true, force: true });
          fs.mkdirSync("Payload", { recursive: true });

          const targetApp = path.join("Payload", path.basename(bestApp));
          execSync(`cp -R "${bestApp}" "${targetApp}"`);

          const tag = process.env.TAG_NAME || "v1.2.0";
          execSync(`zip -r "ios-artifacts/TG-Drive-${tag}-iOS-Direct-Install.ipa" Payload`);
          execSync(`zip -r "ios-artifacts/TG-Drive-${tag}-iOS-Simulator-App.zip" "${bestApp}"`);

          console.log("Successfully created iOS packages:");
          for (const f of fs.readdirSync("ios-artifacts")) {
            const stat = fs.statSync(path.join("ios-artifacts", f));
            console.log(` - ${f}: ${(stat.size / (1024*1024)).toFixed(2)} MB`);
          }
          '

      - name: Upload iOS Artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || 'v1.2.0' }}
        run: |
          if [ -d ios-artifacts ] && [ "$(ls -A ios-artifacts)" ]; then
            gh release upload "${TAG_NAME}" ios-artifacts/* --clobber
          fi
