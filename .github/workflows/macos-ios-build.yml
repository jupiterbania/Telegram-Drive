name: "macOS & iOS Build"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to upload assets to (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon ARM64
            target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
          - name: Intel x86_64
            target: x86_64-apple-darwin
            artifact_suffix: macos-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Prepare Tauri signing key if provided
        working-directory: app
        shell: node {0}
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          const fs = require('fs');
          const key = (process.env.KEY || '').trim();
          if (key) {
            const b64 = key.startsWith('untrusted comment:')
              ? Buffer.from(key).toString('base64')
              : key;
            fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${b64}\n`);
          }

      - name: Build macOS DMG Bundle
        working-directory: app
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --bundles dmg || true

      - name: Prepare macOS release artifacts
        working-directory: app
        run: |
          mkdir -p macos-artifacts
          find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name "*.dmg" -exec cp {} "macos-artifacts/Telegram-Drive-v1.2.0-${{ matrix.artifact_suffix }}.dmg" \; || true
          find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name "*.app" -exec tar -czf "macos-artifacts/Telegram-Drive-v1.2.0-${{ matrix.artifact_suffix }}.app.tar.gz" -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" "TG Drive.app" \; || true
          ls -la macos-artifacts/

      - name: Upload macOS artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -d macos-artifacts ] && [ "$(ls -A macos-artifacts)" ]; then
            gh release upload "${TAG_NAME}" macos-artifacts/* --clobber
          else
            echo "No artifacts found to upload."
            exit 1
          fi

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Initialize Tauri iOS project
        working-directory: app
        run: |
          npm run tauri ios init || true

      - name: Build iOS using Tauri and Xcode
        working-directory: app
        run: |
          npm run tauri ios build -- --target aarch64 --ci || true
          if [ -d "src-tauri/gen/apple" ]; then
            cd src-tauri/gen/apple
            xcodebuild -scheme $(xcodebuild -list | grep -m1 "app_iOS" | tr -d '[:space:]') \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath derivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" || true
          fi

      - name: Package iOS IPA & Archive Artifacts
        working-directory: app
        run: |
          mkdir -p ios-artifacts
          APP_PATH=$(find src-tauri -name "*.app" -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri -name "*.app" -path "*iphoneos*" | head -n 1)
          fi
          if [ -n "$APP_PATH" ]; then
            echo "Found iOS App at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r ios-artifacts/Telegram-Drive-v1.2.0-ios.ipa Payload
            zip -r ios-artifacts/Telegram-Drive-v1.2.0-ios-app.zip "$APP_PATH"
          fi
          find src-tauri -name "*.xcarchive" -exec zip -r ios-artifacts/Telegram-Drive-v1.2.0-ios.xcarchive.zip {} \; || true
          ls -la ios-artifacts/ || true

      - name: Upload iOS artifacts to Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -d ios-artifacts ] && [ "$(ls -A ios-artifacts)" ]; then
            gh release upload "${TAG_NAME}" ios-artifacts/* --clobber
          else
            echo "No iOS artifacts found."
            exit 1
          fi
